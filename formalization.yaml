# formalization.yaml (v0.4): repo-root metadata for this formalization,
# following https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "local-class-field-theory"
  description: >-
    Lean 4 / Mathlib formalization of local class field theory for finite extensions of ℚ_p:
    inertia and the unramified quotient, arithmetic Frobenius, and the topological Artin reciprocity map
    Kˣ → Gal(K^ab/K) with its characterising properties (units map isomorphically to inertia, uniformisers
    map to arithmetic Frobenius modulo inertia, compatibility with norms for finite extensions).
    Current state: foundations (valuation theory of finite extensions of ℚ_p, unramified
    extensions and Frobenius, Herbrand quotients) and the class field axiom for cyclic
    extensions, and local reciprocity Kˣ/N Lˣ ≃ Gal(L/K) for every finite abelian L inside an
    algebraic closure; the Artin map Kˣ → Gal(K^ab/K) (continuous, injective, dense image,
    uniformisers to Frobenius modulo inertia, units isomorphically onto inertia), norm compatibility
    for all finite K'/K, conjugation functoriality, and the existence theorem (every finite-index
    subgroup of Kˣ is a norm group); Gal(K^ab/K) as the profinite completion of Kˣ, uniqueness of
    the Artin map, independence of the algebraic closure, unit filtration and conductors.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Local Fields"
    authors: ["Jean-Pierre Serre"]
    type: "book"
    location: "Chapters XIV-XV"
    note: "Reference (README, Established sources)."
  - title: "Algebraic Number Theory"
    authors: ["Jürgen Neukirch"]
    type: "book"
    location: "Chapter VI"
    note: "Reference (README, Established sources)."

related_formalizations:
  - id: "https://github.com/lana-agents/continuous-kummer-theory"
    relationship: "builds-on"
    note: "Required (pinned 98b67df) for the finiteness of Kˣ/(Kˣ)ⁿ in the Kummer case of the existence theorem."

classification:
  arxiv: ["math.NT"]
  msc2020: ["11S31"]

status:
  scope: "foundations, unramified extensions, Frobenius, Herbrand quotients, class field axiom, local reciprocity for finite abelian extensions inside Ω; Artin map K^x -> Gal(K^ab/K) (continuous, injective, dense image, Frobenius and inertia properties, units ≅ inertia); norm compatibility for finite K'/K; conjugation functoriality; existence theorem; profinite completion; uniqueness; independence of Ω; conductors; Brauer groups: H^2 with locally constant cochains, cyclic periodicity, inflation-restriction, |Br(L/K)| = [L:K], invariant map Br(K) ≃ Q/Z, fundamental class; H^2(K, μ_n) ≃ Z/n; local duality for μ_n and Z/n"
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "PadicField.e_mul_f: e(L/K) * f(L/K) = [L : K]"
    - "PadicField.v_norm: v_K (N_{L/K} x) = f(L/K) * v_L x"
    - "PadicField.isGalois_of_isUnramified: unramified extensions are Galois"
    - "PadicField.residueGalEquiv, PadicField.frob: Gal(L/K) ≃ Gal(residue fields), arithmetic Frobenius"
    - "Herbrand.herbrand_eq_mul_of_ses: Herbrand quotients are multiplicative"
    - "PadicField.index_normGroup_of_isCyclic: [K^x : N_{L/K} L^x] = [L : K] for cyclic L/K"
    - "PadicField.index_normGroup_le: second inequality for abelian L/K"
    - "PadicField.rhoF_norm_tau: Neukirch's formula at a standard level"
    - "PadicField.comap_rhoF_fixingSubgroup: K^x / N L^x = Gal(L/K) for cyclic L inside a standard level"
    - "PadicField.exists_totRam_le_sup: every cyclic L ⊆ Ω lies in M ⊔ K_s (M cyclic totally ramified)"
    - "PadicField.StdLevel.rho_res_eq_of_le: independence of the standard level"
    - "PadicField.cycRec, PadicField.ker_cycRec, PadicField.cycRec_norm_frobLift: cyclic reciprocity map, kernel N L^x, Neukirch's formula"
    - "PadicField.abRec, PadicField.ker_abRec, PadicField.abRec_surjective, PadicField.abRecEquiv: K^x / N L^x ≃ Gal(L/K) for finite abelian L ⊆ Ω"
    - "PadicField.resHom_abRec_of_le: compatibility of abRec with restriction"
    - "PadicField.artin, PadicField.artin_apply, PadicField.continuous_artin: the Artin map K^x -> Gal(K^ab/K), continuous"
    - "PadicField.mk_eq_arithFrob_of_artin, PadicField.mem_absInertia_of_artin: uniformisers map to Frobenius mod inertia, units into inertia"
    - "PadicField.artin_baseChange: artin_{K'}(x) restricted to K^ab equals artin_K(N_{K'/K} x) for every finite K'/K"
    - "PadicField.abRec_conj: conjugation functoriality abRec_L(g x) = g abRec_L(x) g^-1"
    - "PadicField.exists_abFin_normGroup_eq_pow: (K^x)^n is a norm group when μ_n ⊆ K (Kummer case)"
    - "PadicField.exists_abFin_le_norm: norm limitation step for cyclic K'/K"
    - "PadicField.existence: every finite-index subgroup of K^x is the norm group of a finite abelian extension"
    - "PadicField.existsUnique_normGroup_eq, PadicField.le_iff_normGroup_le: L ↦ N_{L/K} L^x is an order-reversing bijection onto finite-index subgroups"
    - "PadicField.artin_injective, PadicField.denseRange_artin: the Artin map is injective with dense image"
    - "PadicField.unitsInertiaEquiv: units of O_K ≃* Gal(K^ab/K^ur) via the Artin map"
    - "PadicField.artinCompletionEquiv: profinite completion of K^x ≃ₜ* Gal(K^ab/K), extending the Artin map"
    - "PadicField.eq_artin_of_forall, PadicField.eq_artin_iff: the Artin map is the unique homomorphism with the Frobenius and norm properties"
    - "PadicField.galMaxAbelianEquiv_artin, PadicField.abRec_map: independence of the algebraic closure Ω"
    - "PadicField.unitFiltration, PadicField.exists_unitFiltration_le_normGroup: unit filtration and existence of conductors"
    - "PadicField.absInertia_eq, PadicField.unramifiedQuotientEquiv, PadicField.arithFrob: inertia, unramified quotient, Frobenius"
    - "ContH2.cyclicEquiv: H^2(G, M) ≃ M^G / N_G M for finite cyclic G (periodicity)"
    - "ContH2.map_injective, ContH2.exists_map_eq_of_res: inflation-restriction in degree two"
    - "Brauer.relCyclicEquiv, PadicField.card_rel_of_isCyclic: Br(L/K) ≃ K^x / N L^x, |Br(L/K)| = [L:K] for cyclic L/K"
    - "Brauer.infl_injective, Brauer.exists_infl_eq: Br(K) = H^2(Gal(Ω/K), Ω^x) is the union of the Br(L/K)"
    - "PadicField.isCyclic_or_exists_normal: Galois groups of local fields are solvable (tame character, wild inertia is a p-group)"
    - "PadicField.card_contH2_le, PadicField.card_relBr_le: |H^2(H, L^x)| ≤ |H|"
    - "PadicField.invUrEquiv: Br(K^ur/K) ≃ Q/Z"
    - "PadicField.invEquiv, PadicField.brUr_eq_top, PadicField.card_relBr_eq: the invariant map Br(K) ≃ Q/Z, |Br(L/K)| = [L:K]"
    - "PadicField.invEquiv_res: inv_{K'} ∘ res = [K':K] · inv_K"
    - "PadicField.fundClass, PadicField.invEquiv_infl_fundClass, PadicField.zpowers_fundClass: the fundamental class u_{L/K}"
    - "Brauer.toBr_injective, Brauer.mem_range_toBr_iff, PadicField.h2MuEquiv: H^2(K, μ_n) ≃ Br(K)[n] ≃ Z/n (cyclotomic rigidity)"
    - "Brauer.toBr_mk_cupKummer, Brauer.carryClass_eq_one_iff: χ ∪ κ(a) is the carry class of L_χ; trivial iff a is a norm from L_χ"
    - "PadicField.pairing, PadicField.eq_one_of_forall_pairing_eq_zero, PadicField.exists_pairing_ne_zero_of_not_mem_pow: perfect local duality pairing H^1(K, Z/n) × K^x/(K^x)^n → Z/n"
    - "PadicField.pairing_eq_artinChar: the cup product pairing computes the Artin map, <χ, a> = χ(artin a)"
    - "ContH2.cor, ContH2.cor_res, Brauer.corBr, Brauer.corBr_res, PadicField.invEquiv_corBr: corestriction, cor ∘ res = [K':K], inv ∘ cor = inv"
    - "PadicField.invEquiv_infl_cupClass, PadicField.relCyclicEquiv_fundClass: for cyclic L/K the fundamental class inverts the reciprocity map"
    - "ContH2.addEquivH2: comparison with Mathlib's groupCohomology.H2"
    - "Brauer.zhatPow, Brauer.eq_zhatPow, Brauer.denseRange_intToZHat: continuous homomorphisms a ↦ g^a out of Ẑ = lim Z/n into profinite groups"
    - "PadicField.galMaxUnramifiedEquiv, PadicField.galMaxUnramifiedEquiv_frobUr: Gal(K^ur/K) ≃ Ẑ as topological groups, Frobenius ↦ 1"
    - "PadicField.galAbEquiv, PadicField.galAbEquiv_artin, PadicField.galAbEquiv_snd, PadicField.galAbEquiv_snd_eq_one_iff: Gal(K^ab/K) ≃ O^x × Ẑ as topological groups after choosing a uniformiser"
    - "Brauer.H2ZHatOne, Brauer.ZHat, PadicField.h2ZHatOneEquiv, PadicField.h2ZHatOneEquiv_res: H^2(K, Ẑ(1)) = lim H^2(K, μ_n) ≃ Ẑ, restriction is multiplication by [K':K]"
    - "ContH2.nakHom, Brauer.relNak, PadicField.relNak_fundClass: for finite abelian L/K, [∏_τ u_{L/K}(τ, g)] = (abRecEquiv L)^-1 g (cup product with the fundamental class inverts reciprocity, explicit degree -2 → 0 formula)"
    - "Brauer.cupH1, PadicField.pairingH1, PadicField.pairingH1_kummer, PadicField.eq_one_of_forall_pairingH1_eq_zero: perfect cup product pairing H^1(K, Z/n) × H^1(K, μ_n) → H^2(K, μ_n) ≃ Z/n"

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    Fields are finite extensions of ℚ_p with all structure derived from the ℚ_p-algebra structure
    (absolute value = spectral norm), rather than Mathlib's IsNonarchimedeanLocalField.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    Statements have not been human-reviewed.

acknowledgements: "Built on Mathlib (Apache-2.0)."
